[project]
name = "fanfic-pairings"
version = "0.1.0a1"
description = "Offline app that sorts downloaded fanfiction by pairing, character and fandom (Windows and Linux alpha)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "PySide6-Essentials>=6.7",
    "pypdfium2>=4.30",
]

[project.urls]
Homepage = "https://github.com/lumierecoding/fanfic-pairings"
Issues = "https://github.com/lumierecoding/fanfic-pairings/issues"

[project.gui-scripts]
fanfic-pairings = "fanficpairings.ui.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fanficpairings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
